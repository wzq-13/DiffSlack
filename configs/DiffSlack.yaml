seed: 0

# neural network parameters
lr: 1.0e-3
weight_decay: 1.0e-4
lr_decay: 0.8
lr_decay_step: 100 #3000

batch_size: 512

num_epochs_stage1: 300
num_epochs_stage2: 100
begin_epoch: 300

input_dim: 66
hidden_dim: [128, 256, 512, 512]
output_dim: 280
N_dim: 7
slack_dim: 5
dropout: 0.0
eval_step: 5
save_step: 20
obj_weight: 1.0
constraint_weight: 1.0
guide_weight: 1.0
obs_constraints_weight: 1000.0

# DiffSlack parameters
slack_weight: 1.0
proj_loss_weight: 50.0
max_depth: 50
inference_tol: 1.0e-3
training_tol: 1.0e-3
# DiffSlack projection metric (used identically in training and testing)
w_traj: 5.0
w_slack: 1.0
damping: 1.0e-4
# learned | zero | constant | analytic
slack_initialization: learned
slack_initialization_constant: 0.1

# Optional post-test diagnosis. Disabled keeps the original test path unchanged.
enable_failure_diagnosis: false
diag_i_max: 200
enable_sample_overfit: true
diag_overfit_steps: 2000
diag_overfit_lr: 1.0e-3
diag_overfit_endpoint_weight: 5.0
